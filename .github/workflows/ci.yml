name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/kotak-sdk/requirements.txt
      - run: python -B -m unittest discover -s tests/python -p 'test_*.py'
      - name: Test private staging release safeguards
        run: |
          bash -n deploy-staging.sh deploy/private-staging/release-remote.sh
          python -B -m unittest discover -s tests/deploy -p 'test_*.py'
      - name: Validate production images
        run: |
          docker build --target api -t nraialgo-api:ci .
          docker build --target web -t nraialgo-web:ci .
          docker compose --env-file deploy/digitalocean/.env.example -f deploy/digitalocean/compose.yml config --quiet
