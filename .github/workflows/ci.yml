name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nraialgo
          POSTGRES_PASSWORD: nraialgo
          POSTGRES_DB: nraialgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations run with the ephemeral CI owner while the application and
      # integration assertions run with the same least-privilege role used in
      # production. This prevents CI from hiding missing grants.
      TEST_DATABASE_ADMIN_URL: postgresql://nraialgo:nraialgo@localhost:5432/nraialgo
      TEST_DATABASE_RUNTIME_PASSWORD: nraialgo_test_runtime
      DATABASE_URL: postgresql://nraialgo_app:nraialgo_test_runtime@localhost:5432/nraialgo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/kotak-sdk/requirements.txt
      - run: python -m unittest discover -s services/kotak-sdk -p 'test_*.py'
      - name: Test private staging release safeguards
        run: |
          bash -n deploy-staging.sh deploy/private-staging/release-remote.sh
          python -m unittest discover -s deploy/private-staging/tests -p 'test_*.py'
      - name: Validate production images
        run: |
          docker build --target api -t nraialgo-api:ci .
          docker build --target web -t nraialgo-web:ci .
          docker compose --env-file deploy/digitalocean/.env.example -f deploy/digitalocean/compose.yml config --quiet
